[build]
  command = "pnpm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Serve mp4 files with correct media headers
[[headers]]
  for = "/*.mp4"
  [headers.values]
    Content-Type = "video/mp4"
    Accept-Ranges = "bytes"
    Cache-Control = "public, max-age=31536000, immutable"

# SPA routing - exclude static files from redirect
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = {Language = []}
  force = false
